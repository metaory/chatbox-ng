<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="%VIEWPORT_CONTENT%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Unbundled" />
    <meta name="theme-color" content="#efeeef" />
    <meta name="description" content="A Chatbox fork without gated features" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Unbundled</title>
    <script>
      var initialTheme = localStorage.getItem('initial-theme')
      if (initialTheme !== 'light' && initialTheme !== 'dark') {
        initialTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        localStorage.setItem('initial-theme', initialTheme)
      }
      document.documentElement.setAttribute('data-theme', initialTheme)
      document.documentElement.setAttribute('data-mantine-color-scheme', initialTheme)
      var splashPrimary = initialTheme === 'dark' ? '#331144' : '#efeeef'
      var hex = /^#[0-9a-f]{6}$/i
      var raw = localStorage.getItem('initial-interface-colors')
      if (raw) {
        try {
          var stored = JSON.parse(raw)
          var pal = stored && stored[initialTheme]
          if (pal && hex.test(pal.backgroundPrimary)) splashPrimary = pal.backgroundPrimary
        } catch (e) {}
      }
      document.documentElement.style.setProperty('--splash-bg', splashPrimary)
      var themeColor = document.querySelector('meta[name="theme-color"]')
      if (themeColor) themeColor.setAttribute('content', splashPrimary)
    </script>
    <style>
      html,
      html[data-theme='dark'],
      html[data-theme='dark'] .splash-screen {
        background-color: var(--splash-bg, #331144);
      }

      .splash-screen {
        background-color: var(--splash-bg, #efeeef);
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0.2;
        overflow: hidden;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-bottom {
        flex: 3;
        width: 100%;
        position: relative;
      }
      .splash-screen-content {
        flex: 0 0 auto;
        position: relative;
        z-index: 1;
      }

      .splash-screen-logo {
        display: block;
        width: 96px;
        height: 96px;
      }

      .splash-screen-logo-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .splash-screen-fade-out {
        animation: fade-out 0.5s ease-in-out forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div class="splash-screen">
      <canvas class="splash-screen-logo-bg"></canvas>
      <div class="splash-screen-top"></div>
      <div class="splash-screen-content">
        <img class="splash-screen-logo" src="./static/icon.png" width="96" height="96" alt="" />
      </div>
      <div class="splash-screen-bottom" id="log-root"></div>
      <script>
        const splashCanvas = document.querySelector('.splash-screen-logo-bg')
        const splashCtx = splashCanvas.getContext('2d')
        const splashRamp = '.,-~:;=*#%@$'
        const splashSpin = { a: 0, last: 0 }
        const splashFps = 1000 / 30
        const splashTau = Math.PI * 2
        splashCanvas.width = innerWidth
        splashCanvas.height = innerHeight
        const splashFont = Math.max(12, Math.min(innerWidth, innerHeight) / 32)
        splashCtx.font = splashFont + 'px ui-monospace, monospace'
        splashCtx.textAlign = 'left'
        splashCtx.textBaseline = 'top'
        splashCtx.fillStyle = '#ffffff80'
        const splashCharW = splashCtx.measureText('@').width
        const splashCols = Math.max(16, (splashCanvas.width / splashCharW) | 0)
        const splashRows = Math.max(16, (splashCanvas.height / splashFont) | 0)
        const splashCx = splashCanvas.width / 2
        const splashCy = splashCanvas.height * 0.4
        const splashRadius = Math.min(splashCanvas.width, splashCanvas.height) * 0.42

        function splashFrame(now) {
          if (!splashCanvas.isConnected) return
          requestAnimationFrame(splashFrame)
          const wait = now - splashSpin.last
          if (wait < splashFps) return
          const dt = Math.min(0.05, wait / 1000)
          splashSpin.last = now
          splashSpin.a += 3.2 * dt
          splashCtx.clearRect(0, 0, splashCanvas.width, splashCanvas.height)
          for (let row = 0; row < splashRows; row++) {
            let line = ''
            const py = (row + 0.5) * splashFont - splashCy
            for (let col = 0; col < splashCols; col++) {
              const px = (col + 0.5) * splashCharW - splashCx
              const dist = Math.hypot(px, py) / splashRadius
              if (dist > 1 || dist < 0.12) {
                line += ' '
                continue
              }
              const theta = Math.atan2(px, -py)
              const d = splashSpin.a - theta - Math.floor((splashSpin.a - theta) / splashTau) * splashTau
              const fade = d < 2.4 ? (1 - d / 2.4) ** 2 : 0
              const ring = Math.abs((dist * 3) % 1) < 0.055 ? 0.32 : 0
              const n = Math.min(1, fade * 0.95 + ring * (0.18 + fade * 0.55))
              line += n < 0.05 ? ' ' : splashRamp[(n * (splashRamp.length - 1)) | 0]
            }
            splashCtx.fillText(line, 0, row * splashFont)
          }
        }

        requestAnimationFrame(splashFrame)
      </script>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
