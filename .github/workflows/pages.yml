name: Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build:web

      - name: SPA fallback
        run: |
          dist=release/app/dist/renderer
          printf '%s\n' '/* /index.html 200' > "$dist/_redirects"
          cp src/renderer/static/_headers "$dist/_headers"

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy release/app/dist/renderer --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'chatbox-ng' }}
